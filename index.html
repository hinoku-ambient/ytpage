<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hinoku</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0e16; color: #eef0f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  /* Background image is set from pages.js. This gradient is the fallback. */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      linear-gradient(180deg, rgba(8,10,18,0) 0%, rgba(8,10,18,0) 60%, rgba(8,10,18,0.45) 100%),
      radial-gradient(120% 80% at 50% 0%, #2a3158 0%, #121626 60%, #0b0e16 100%);
    background-size: cover; background-position: center; background-repeat: no-repeat;
  }

  main {
    position: relative; z-index: 1;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    text-align: center; padding: 24px 24px calc(48px + env(safe-area-inset-bottom));
  }

  .card {
    width: 100%; max-width: 360px; padding: 28px 22px 24px;
    background: rgba(14, 17, 28, 0.45);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 22px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  h1 { font-size: 30px; font-weight: 600; margin: 0 0 8px; letter-spacing: 0.14em; text-transform: uppercase; }
  .sub { margin: 0 0 22px; opacity: 0.82; line-height: 1.5; font-size: 15px; }
  .sub:empty, .note:empty { display: none; }

  #buttons { display: flex; flex-direction: column; gap: 12px; }
  .btn {
    display: block; width: 100%; text-decoration: none; text-align: center;
    font-size: 18px; font-weight: 600; padding: 17px 20px; border-radius: 999px;
    color: #fff; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.18);
  }
  .btn:active { transform: scale(0.98); }
  .btn.youtube { background: #ff0033; border-color: #ff0033; }
  .btn.spotify { background: #1db954; border-color: #1db954; color: #07130b; }
  .btn.apple   { background: linear-gradient(135deg, #fa2d48, #fb5c74); border-color: #fa2d48; }
  .btn.primary { animation: pulse 2.6s ease-out infinite; }
  .note { margin: 14px 0 0; font-size: 12.5px; opacity: 0.6; }
  .hint { margin: 22px 0 0; font-size: 12px; opacity: 0.45; }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(255,255,255,0.35); }
    70%  { box-shadow: 0 0 0 16px rgba(255,255,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
  }
  @media (prefers-reduced-motion: reduce) { .btn.primary { animation: none; } }
</style>

<!-- Meta Pixel -->
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '2675429902656201');
fbq('track', 'PageView');
</script>

<!-- All pages and buttons are defined in pages.js -->
<script src="pages.js"></script>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<main>
  <div class="card">
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
    <div id="buttons"></div>
    <p class="note" id="note"></p>
  </div>
  <p class="hint">Not opening? Tap the menu (three dots) and choose "Open in browser".</p>
</main>
<script>
(function () {
  // Used only if pages.js is missing or broken
  var FALLBACK = {
    title: "Hinoku",
    subtitle: "Ambient mixes for focus, sleep and late nights.",
    note: "",
    background: "bg.jpg",
    event: "OpenYouTubeTap",
    buttons: [{ type: "youtube", label: "Open in YouTube",
      url: "https://www.youtube.com/channel/UC6uI8obP9dpYqzUZUSH8acA?sub_confirmation=1" }]
  };

  var pages = window.PAGES || {};
  var key = new URLSearchParams(location.search).get("p") || "youtube";
  var page = pages[key] || pages["youtube"] || FALLBACK;

  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var PKG = { youtube: "com.google.android.youtube", spotify: "com.spotify.music", apple: "com.apple.android.music" };

  function iosScheme(type, url) {
    try {
      var u = new URL(url);
      if (type === "youtube") {
        // Video links need their ?v=ID, channel links do not
        return "youtube://" + u.host + u.pathname + (u.pathname === "/watch" ? u.search : "");
      }
      if (type === "apple")   { return "music://" + u.host + u.pathname + u.search; }
      if (type === "spotify") {
        var m = u.pathname.match(/\/(playlist|album|track|artist)\/([A-Za-z0-9]+)/);
        if (m) { return "spotify:" + m[1] + ":" + m[2]; }
      }
    } catch (err) {}
    return null;
  }

  function androidIntent(type, url) {
    var u = new URL(url);
    var keepQuery = (type === "apple") || (type === "youtube" && u.pathname === "/watch");
    return "intent://" + u.host + u.pathname + (keepQuery ? u.search : "") +
      "#Intent;scheme=https;package=" + PKG[type] + ";" +
      "S.browser_fallback_url=" + encodeURIComponent(url) + ";end";
  }

  // Text and background
  document.title = page.title || "Hinoku";
  document.getElementById("title").textContent = page.title || "";
  document.getElementById("subtitle").textContent = page.subtitle || "";
  document.getElementById("note").textContent = page.note || "";
  if (page.background) {
    document.getElementById("bg").style.backgroundImage =
      'linear-gradient(180deg, rgba(8,10,18,0) 0%, rgba(8,10,18,0) 60%, rgba(8,10,18,0.45) 100%), ' +
      'url("' + encodeURI(page.background) + '"), ' +
      'radial-gradient(120% 80% at 50% 0%, #2a3158 0%, #121626 60%, #0b0e16 100%)';
  }

  // Buttons
  var box = document.getElementById("buttons");
  (page.buttons || []).forEach(function (b, i) {
    var a = document.createElement("a");
    a.className = "btn " + (b.type || "custom") + (i === 0 ? " primary" : "");
    a.textContent = b.label || "Open";
    a.href = b.url;
    var ev = b.event || page.event;

    if (isAndroid && PKG[b.type]) {
      try { a.href = androidIntent(b.type, b.url); } catch (err) {}
    }

    a.addEventListener("click", function (e) {
      if (ev) { try { fbq("trackCustom", ev); } catch (err) {} }
      if (isIOS) {
        var s = iosScheme(b.type, b.url);
        if (s) {
          e.preventDefault();
          window.location.href = s;
          setTimeout(function () {
            if (document.visibilityState === "visible") { window.location.href = b.url; }
          }, 1500);
        }
      }
    });
    box.appendChild(a);
  });
})();
</script>
</body>
</html>
